<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="Find businesses near you by category. No login, no cost." />
  <title>BusinessFinder</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>BusinessFinder</h1>
    <p class="tagline">Pick a category, find places near you.</p>
  </header>

  <main>
    <section class="controls" aria-label="Search controls">
      <div class="control-row">
        <label for="radius">Within</label>
        <select id="radius" aria-label="Search radius">
          <option value="1000">1 km</option>
          <option value="2000" selected>2 km</option>
          <option value="5000">5 km</option>
          <option value="10000">10 km</option>
        </select>
        <button id="locateBtn" class="btn btn-primary" type="button">
          Use my location
        </button>
      </div>
      <p id="locationStatus" class="location-status" role="status">Location not set.</p>
    </section>

    <section class="categories" aria-label="Business categories">
      <h2 class="section-title">Choose a category</h2>
      <div id="categoryGrid" class="category-grid"><!-- filled by app.js --></div>
    </section>

    <section class="results" aria-label="Results">
      <div id="resultsHeader" class="results-header" hidden>
        <h2 class="section-title" id="resultsTitle">Results</h2>
        <span id="resultsCount" class="results-count"></span>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <ul id="resultsList" class="results-list"><!-- filled by app.js --></ul>
    </section>
  </main>

  <footer class="app-footer">
    Data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.
  </footer>

  <script src="app.js"></script>
</body>
</html>
